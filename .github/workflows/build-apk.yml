name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor globally
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android --legacy-peer-deps --save

      - name: Verify cap command
        run: |
          which cap || echo "cap not in PATH"
          cap --version || echo "cap not working"
          ls -la node_modules/@capacitor/ 2>&1

      - name: Add Android platform
        run: cap add android

      - name: Sync Capacitor
        run: cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ebadat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
