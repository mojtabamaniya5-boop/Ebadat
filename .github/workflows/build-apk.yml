name: Build Android APK (Release Signed)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Generate app icons
        run: pnpm dlx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Generate Keystore (if not exists in secrets)
        run: |
          cd android
          keytool -genkey -v \
            -keystore ebadat-release.keystore \
            -alias ebadat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ebadat@2024 \
            -keypass ebadat@2024 \
            -dname "CN=Lian App, OU=Dev, O=Lian, L=Bushehr, ST=Bushehr, C=IR"
          
          # نمایش محتوای keystore به صورت Base64
          echo "=== KEYSTORE_BASE64 ==="
          base64 ebadat-release.keystore
          echo "=== END ==="

      - name: Add signing config
        run: |
          cd android/app
          cat >> build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("../ebadat-release.keystore")
                      storePassword "ebadat@2024"
                      keyAlias "ebadat"
                      keyPassword "ebadat@2024"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build APK (release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ebadat-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Keystore (IMPORTANT - save this!)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: android/ebadat-release.keystore
          retention-days: 90
