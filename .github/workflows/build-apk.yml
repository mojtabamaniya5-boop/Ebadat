name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ALL dependencies explicitly
        run: |
          npm install react react-dom react-router-dom framer-motion lucide-react recharts jalaali-js adhan
          npm install -D vite @vitejs/plugin-react vite-plugin-pwa tailwindcss postcss autoprefixer
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Verify installations
        run: |
          npx vite --version
          ls node_modules/vite-plugin-pwa 2>&1 | head -1

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ebadat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
