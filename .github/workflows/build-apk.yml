name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (includes docs/ folder)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor only
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Verify docs folder exists
        run: |
          ls -la docs/
          ls -la docs/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor (uses docs/ folder)
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ebadat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
