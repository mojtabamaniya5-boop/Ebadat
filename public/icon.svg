<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- گرادیانت پس‌زمینه -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- گرادیانت برگ -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- گرادیانت تنه -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>

    <!-- درخشش نور -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- سایه -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه گرد -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- هاله‌های نور -->
  <circle cx="200" cy="160" r="180" fill="url(#glow)"/>
  <circle cx="350" cy="380" r="120" fill="url(#glow)" opacity="0.5"/>

  <!-- دایره تزئینی -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- تنه (ساقه) -->
  <path d="M256 340 L256 220 Q256 210 250 205 L250 340 Z" fill="url(#stemGrad)" filter="url(#shadow)"/>

  <!-- برگ چپ -->
  <path d="M256 260 Q210 240 195 200 Q190 180 210 175 Q240 175 250 210 Q256 235 256 260 Z"
        fill="url(#leafGrad)" filter="url(#shadow)"/>

  <!-- برگ راست -->
  <path d="M256 240 Q302 220 317 180 Q322 160 302 155 Q272 155 262 190 Q256 215 256 240 Z"
        fill="url(#leafGrad)" filter="url(#shadow)"/>

  <!-- جوانه بالا -->
  <path d="M256 200 Q250 175 240 155 Q235 145 245 140 Q258 140 260 160 Q262 180 256 200 Z"
        fill="url(#leafGrad)" opacity="0.9" filter="url(#shadow)"/>

  <!-- نقطه نور مرکزی -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="256" cy="256" r="10" fill="#A7F3D0"/>

  <!-- ستاره‌های کوچیک -->
  <circle cx="150" cy="180" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="370" cy="200" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="160" cy="380" r="3.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="380" cy="360" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="130" cy="290" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="400" cy="290" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- درخشش‌های کوچیک -->
  <path d="M140 240 L143 243 L140 246 L137 243 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M380 250 L383 253 L380 256 L377 253 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M200 130 L202 132 L200 134 L198 132 Z" fill="#FFFFFF" opacity="0.7"/>
  <path d="M320 400 L322 402 L320 404 L318 402 Z" fill="#FFFFFF" opacity="0.7"/>
</svg>
